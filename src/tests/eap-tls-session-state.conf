#
#   eapol_test -c eap-tls-session-state.conf -s testing123
#
#   The "test" virtual server adds Framed-MTU = 1300 to session-state for
#   this user, which must reach the Access-Accept.
#
network={
	key_mgmt=IEEE8021X
	eap=TLS

	identity="session-state-mtu@example.org"

	phase1=""

	ca_cert="../../raddb/certs/ca.pem"
	client_cert="../../raddb/certs/client.crt"
	private_key="../../raddb/certs/client.key"
	private_key_passwd="whatever"
}
