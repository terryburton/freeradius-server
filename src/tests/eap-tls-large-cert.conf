#
#   eapol_test -c eap-tls-large-cert.conf -s testing123
#
#   The client certificate is so large that the client's TLS message
#   is longer than one TLS record (16384 octets).  The Makefile
#   creates it.
#
network={
	key_mgmt=IEEE8021X
	eap=TLS

	identity="user@example.org"

	phase1=""

	ca_cert="../../raddb/certs/ca.pem"
	client_cert="../../build/tests/eap/client-large.crt"
	private_key="../../raddb/certs/client.key"
	private_key_passwd="whatever"
}
