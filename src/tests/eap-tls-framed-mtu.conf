network={
	key_mgmt=IEEE8021X
	eap=TLS

	identity="framed-mtu@example.org"

	phase1=""

	ca_cert="../../raddb/certs/ca.pem"
	client_cert="../../raddb/certs/client.crt"
	private_key="../../raddb/certs/client.key"
	private_key_passwd="whatever"
}
