#
#   eapol_test -c peap-eap-tls-cbc.conf -s testing123
#
#   PEAP with an inner EAP-TLS, over TLS 1.2 with a CBC cipher.  Its larger
#   record overhead means that some inner packets take more than one round
#   of the outer session.
#
network={
	key_mgmt=IEEE8021X
	eap=PEAP
	identity="user@example.org"
	phase1="tls_disable_tlsv1_3=1"
	phase2="auth=TLS"
	openssl_ciphers="ECDHE-RSA-AES256-SHA384"

	ca_cert="../../raddb/certs/ca.pem"

	ca_cert2="../../raddb/certs/ca.pem"
	client_cert2="../../raddb/certs/client.crt"
	private_key2="../../raddb/certs/client.key"
	private_key2_passwd="whatever"
}
