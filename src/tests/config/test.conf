# -*- text -*-
##
## test.conf	-- Virtual server configuration for testing radiusd.
##
##	$Id$
##

test_port	= 10000

correct_escapes = true

#  Only for testing!
#  Setting this on a production system is a BAD IDEA.
security {
	allow_vulnerable_openssl = yes
}

modules {
	$INCLUDE ${maindir}/mods-enabled/
	$INCLUDE ${testdir}/config/eap-test
}

realm test.example.com {
	authhost = 127.0.0.1:${test_port}
	secret = testing123
}

policy {
	files.authorize {
		if ((User-Name == "bob") || (User-Name == "small-mtu")) {
			update control {
				&Cleartext-Password := "bob"
				&PSK-Password := 0x9f9d51bc70ef21ca5c14f307980a29d8
			}
		}
	}

	$INCLUDE ${maindir}/policy.d/
}


#
#  This virtual server is chosen for processing requests when using:
#
#	radiusd -Xd src/tests/ -i 127.0.0.1 -p 12340 -n test
#
server test {
	listen {
		ipaddr = 127.0.0.1
		port = ${test_port}
		type = auth
	}

authorize {
	update reply {
		&Test-Server-Port = "%{Packet-Dst-Port}"
	}

	#
	#  Act as a NAS with a small MTU, for the Framed-MTU tests.
	#
	if (User-Name =~ /^framed-mtu/) {
		update request {
			&Framed-MTU := 600
		}
	}

	#
	#  Put a Framed-MTU in session-state once the EAP-TLS session has
	#  started, as the inner tunnel does when it copies its reply to the
	#  outer session-state.  It must reach the Access-Accept.
	#
	if ((User-Name =~ /^session-state-mtu@/) && &session-state:Framed-MTU && !&session-state:Framed-MTU[1]) {
		update session-state {
			&Framed-MTU += 1300
		}
	}

	#
	#  Act as a NAS with a small MTU, for the EAP-pwd test.
	#
	if (User-Name == "small-mtu") {
		update request {
			&Framed-MTU := 105
		}
	}

	if (User-Name == "bob") {
		#
		#  Digest-* tests have a password of "zanzibar"
		#  Or, a hashed version thereof.
		#
		if (Digest-Response) {
			if (&Test-Number == "1") {
				update control {
					&Cleartext-Password := "zanzibar"
				}
			}
			elsif (Test-Number == "2") {
				update control {
					&Digest-HA1 := 12af60467a33e8518da5c68bbff12b11
				}
			}
		}	
		else {
			update control {
				&Cleartext-Password := "bob"
				&PSK-Password := 0x9f9d51bc70ef21ca5c14f307980a29d8
			}
		}
	}

	if (User-Name =~ /^(.*)@test\.example\.com$/) {
		update request {
			&Stripped-User-Name := "%{1}"
		}
		update control {
			&Proxy-To-Realm := test.example.com
		}
	}

	chap
	mschap
	digest
	eap-test
	pap
}

authenticate {
	pap
	chap
	mschap
	digest
	eap-test
}

#
#  As the "default" virtual server does, so that the tests see what an
#  EAP session leaves in session-state for the reply.
#
post-auth {
	update {
		&reply: += &session-state:
	}
}

accounting {
	if (Packet-Src-IP-Address != 255.255.255.255) {
		detail
	}

	ok
}

}
