#
#   eapol_test -r 3 -c eap-tls-13-resume.conf -s testing123
#
#   EAP-TLS on TLS 1.3, resumed three times.  A resumed TLS 1.3 session
#   gets a new session ID, and each one must be resumable in turn.
#
network={
	key_mgmt=IEEE8021X
	eap=TLS

	identity="user@example.org"

	phase1="tls_disable_tlsv1_0=1 tls_disable_tlsv1_1=1 tls_disable_tlsv1_2=1 tls_disable_tlsv1_3=0"

	ca_cert="../../raddb/certs/ca.pem"
	client_cert="../../raddb/certs/client.crt"
	private_key="../../raddb/certs/client.key"
	private_key_passwd="whatever"
}
