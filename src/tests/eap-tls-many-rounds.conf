#
#   eapol_test -c eap-tls-many-rounds.conf -s testing123
#
#   EAP-TLS with a very small client fragment size, so the session takes
#   more than 50 round trips.  The test configuration sets max_rounds = 100.
#
network={
	key_mgmt=IEEE8021X
	eap=TLS

	identity="user@example.org"

	phase1=""
	fragment_size=60

	ca_cert="../../raddb/certs/ca.pem"
	client_cert="../../raddb/certs/client.crt"
	private_key="../../raddb/certs/client.key"
	private_key_passwd="whatever"
}
