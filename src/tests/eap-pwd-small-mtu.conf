#
#   eapol_test -c eap-pwd-small-mtu.conf -s testing123
#
#   EAP-pwd has fragment_size = 100, and the "test" virtual server sets
#   Framed-MTU = 105 for this user, which allows EAP packets of 101
#   octets: the Framed-MTU less the EAPoL header.  The 102 octets of the
#   server's Commit do not fit, so it must be sent in fragments.
#
network={
	key_mgmt=IEEE8021X
	eap=PWD

	identity="small-mtu"
	password="bob"
}
