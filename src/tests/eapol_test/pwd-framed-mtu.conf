#
#   EAP-pwd from a NAS with a small MTU.  The method has fragment_size = 100,
#   and the "test" virtual server sets Framed-MTU = 105 for this user, which
#   allows EAP packets of 101 octets: the Framed-MTU less the EAPoL header.
#   The 97 octets of the server's Commit do not fit, so it must be sent in
#   fragments, the first of which is 101 octets.
#
#   eapol_test -c pwd-framed-mtu.conf -s testing123
#   EAPOL_TEST_EXPECT: decapsulated EAP packet (code=1 id=[0-9]* len=101)
#
network={
	key_mgmt=WPA-EAP
	eap=PWD
	identity="bob@small-mtu.example.org"
	password="bob"
}
