#
#   PEAP with an inner EAP-TLS, from a NAS with a small MTU.  The "test"
#   virtual server sets Framed-MTU = 600 for this outer identity, so the
#   largest EAP packet the server sends must be 596 octets, and the inner
#   EAP-TLS packets must fit into the outer ones.
#
#   ./eapol_test -c peap-framed-mtu-client-eap-tls.conf -s testing123
#   EAPOL_TEST_EXPECT: decapsulated EAP packet (code=1 id=[0-9]* len=596)
#
network={
	ssid="example"
	key_mgmt=WPA-EAP
	eap=PEAP
	identity="bob@example.org"
	anonymous_identity="anonymous_framed-mtu_with_client_cert@example.org"
	password="bob"
	phase2="auth=TLS"
	phase1="peapver=0"

	ca_cert="raddb/certs/rsa/ca.pem"
	client_cert="raddb/certs/rsa/client.crt"
	private_key="raddb/certs/rsa/client.key"
	private_key_passwd="whatever"

	ca_cert2="raddb/certs/rsa/ca.pem"
	client_cert2="raddb/certs/rsa/client.crt"
	private_key2="raddb/certs/rsa/client.key"
	private_key2_passwd="whatever"
}
