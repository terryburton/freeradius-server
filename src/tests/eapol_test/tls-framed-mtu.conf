#
#   EAP-TLS from a NAS with a small MTU.  The "test" virtual server sets
#   Framed-MTU = 600 for this user, so the largest EAP packet the server
#   sends must be 596 octets: the Framed-MTU less the EAPoL header.
#
#   eapol_test -c tls-framed-mtu.conf -s testing123
#   EAPOL_TEST_EXPECT: decapsulated EAP packet (code=1 id=[0-9]* len=596)
#
network={
	key_mgmt=WPA-EAP
	eap=TLS
	identity="framed-mtu@example.org"
	ca_cert="raddb/certs/rsa/ca.pem"
	client_cert="raddb/certs/rsa/client.crt"
	private_key="raddb/certs/rsa/client.key"
	private_key_passwd="whatever"
}
