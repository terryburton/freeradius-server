#
#   EAP-TLS on TLS 1.3, resuming five times with stateless session tickets.
#   Each ticket must be the same size as the last one.  A ticket which
#   grew at each resumption reached 32K, and the fifth resumption failed.
#
#   eapol_test -c tls-v13-stateless-resume5.conf -s testing123
#   EAPOL_TEST_OPTS: -r 5
#   EAPOL_TEST_EXPECT: Handshake finished - resumed=1
#
network={
	key_mgmt=WPA-EAP
	eap=TLS
	identity="user@example.org"
	ca_cert="raddb/certs/rsa/ca.pem"
	client_cert="raddb/certs/rsa/client.crt"
	private_key="raddb/certs/rsa/client.key"
	private_key_passwd="whatever"
	phase1="tls_disable_session_ticket=0 tls_disable_tlsv1_3=0"
}
