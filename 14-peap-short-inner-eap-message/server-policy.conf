#  Add to the server's inner tunnel (raddb/sites-available/inner-tunnel),
#  in its post-auth section.  It stands in for a home server, to which
#  the inner tunnel was proxied, that answers with a one-octet
#  EAP-Message.  It affects only the user "short-eap-message".
	Post-Auth-Type Challenge {
		if (&User-Name == "short-eap-message") {
			update reply {
				&EAP-Message := 0x01
			}
		}
	}
